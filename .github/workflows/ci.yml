# CI: checks the source code, builds the Docker image (no push) and validates compose.
# This workflow has only been written; it has never run on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, lint, build, test, web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Next.js telemetry stays off in CI (nothing is sent to Vercel).
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Type-aware linting of web/ needs the generated Next.js route types.
      - run: npm run web:typegen
      - run: npm run lint
      - run: npm run build
      - run: npm run check-commands
      - run: npm test
      - run: npm run web:typecheck
      - run: npm run web:build
      # Bundle boundary: no discord.js, bot token or server-only module in the web build output.
      - run: npm run web:check

  docker:
    name: Docker image, scripts, compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/common.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: perry-bot:ci
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose files and image pins
        env:
          # Fake values, only so `docker compose config` passes the :? guards
          DISCORD_TOKEN: dummy-token-for-ci-config-check
          DISCORD_CLIENT_ID: "123456789012345678"
          LAVALINK_PASSWORD: dummy-lavalink
          POSTGRES_PASSWORD: dummy-postgres
          REDIS_PASSWORD: dummy-redis
        run: |
          set -euo pipefail
          docker compose config -q
          docker compose --profile web config -q
          docker compose -f docker-compose.dev.yml config -q
          # Lavalink/Postgres/Redis must use the same tags in both files.
          prod=$(docker compose config --images | grep -v '^perry-bot:' | sort -u)
          dev=$(docker compose -f docker-compose.dev.yml --profile storage config --images | sort -u)
          if [ "$prod" != "$dev" ]; then
            echo "Image tags differ between docker-compose.yml and docker-compose.dev.yml:" >&2
            diff <(echo "$prod") <(echo "$dev") >&2 || true
            exit 1
          fi
          echo "$prod"
